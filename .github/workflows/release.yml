name: Release

# Only an explicitly pushed release tag can publish. Branch/PR checks cannot.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate tag and choose npm dist-tag
        id: version
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = require('./package.json').version;
          if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error('Tag must match package version');
          const prerelease = version.includes('-');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${prerelease ? 'next' : 'latest'}\nprerelease=${prerelease}\n`);
          NODE
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Publish validated package
        run: npm publish --access public --tag '${{ steps.version.outputs.tag }}'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
